openapi: 3.1.0
info:
  title: Bread And Basket API
  version: 1.0.0
  description: >
    Bread & Basket: a group-based food procurement and wholesale
    marketplace system.


    Conventions used across the whole API:

    - Money is whole Kenyan shillings, sent as integers. The database stores
      decimal(10,2); the API rounds to whole KES.

    - Timestamps are ISO 8601 with a time zone, e.g. 2026-11-14T18:00:00+03:00.

    - Fields marked readOnly are worked out by the server. Clients never send them.

    - Every error, including 422 validation errors, uses the Error schema:
      {"error": "...", "code": "..."}. A Flask error handler reshapes
      flask-smorest's default 422 body into this shape.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

# Every path below sits under /api (the flask-smorest blueprints use url_prefix="/api/...").
servers:
  - url: http://localhost:5000/api
    description: Local Flask server

tags:
  - name: Registration
    description: Create consumer and wholesaler accounts
  - name: Authentication
    description: Log in consumers, wholesalers and admins
  - name: Campaigns
    description: Browse group-buying campaigns (consumer home, browse and campaign pages)
  - name: Locations
    description: Delivery areas and collection points used at checkout
  - name: Orders
    description: A consumer's own orders (place, track, cancel, confirm receipt)
  - name: Account
    description: The logged-in user
  - name: Seller
    description: Wholesaler screens (seller role only; writing needs an approved seller)
  - name: Admin
    description: Admin screens (admin role only)

# Default: every endpoint needs a JWT. Public endpoints override this with `security: []`.
security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------
  # Registration and login
  # ------------------------------------------------------------------
  /consumers:
    post:
      summary: Register a consumer
      operationId: registerConsumer
      tags: [Registration]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsumerRegister' }
      responses:
        '201':
          description: Consumer account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              examples:
                consumer: { $ref: '#/components/examples/AuthConsumer' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /wholesalers:
    post:
      summary: Register a wholesaler
      description: The account is created with verification_status "pending" until an admin approves it.
      operationId: registerWholesaler
      tags: [Registration]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WholesalerRegister' }
      responses:
        '201':
          description: Wholesaler account created (pending verification)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              examples:
                pendingSeller: { $ref: '#/components/examples/AuthSellerPending' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /login:
    post:
      summary: Log in (consumer, wholesaler or admin)
      operationId: loginUser
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserLogin' }
      responses:
        '200':
          description: Login was successful. The frontend routes by user.role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              examples:
                consumer: { $ref: '#/components/examples/AuthConsumer' }
                pendingSeller: { $ref: '#/components/examples/AuthSellerPending' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ------------------------------------------------------------------
  # Campaigns
  # ------------------------------------------------------------------
  /campaigns:
    get:
      summary: List active campaigns
      description: >
        One endpoint feeds both the consumer home page and the browse page.
        The home page's rails are just filters of the same list:
        "Ending soon" uses filter=ending_soon, "Almost unlocked" uses
        filter=almost_unlocked, and the category circles use category=...


        Only active campaigns are returned, soonest deadline first.
        No pagination: the MVP has a few dozen campaigns at most.
      operationId: listCampaigns
      tags: [Campaigns]
      security: []   # public: the landing page shows campaigns to visitors
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/Category' }
          description: Only campaigns whose product is in this category.
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 60 }
          description: Search text, matched against the product name and campaign title.
        - name: filter
          in: query
          schema: { type: string, enum: [ending_soon, almost_unlocked] }
          description: >
            ending_soon = deadline within the next 48 hours.
            almost_unlocked = minimum not reached yet.
      responses:
        '200':
          description: Active campaigns (an empty list if nothing matches)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CampaignSummary' }
              examples:
                active: { $ref: '#/components/examples/CampaignList' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaigns/{campaign_id}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: Get one campaign (campaign page and Join pop-up)
      description: >
        Everything the campaign page and the Join pop-up need, apart from the
        list of locations (GET /locations).


        Login is optional. With a token, the personal fields (my_quantity,
        max_orderable) are filled in; without one they are null.
        Draft campaigns return 404 to consumers.
      operationId: getCampaign
      tags: [Campaigns]
      # Optional auth: `{}` = no token is fine; bearerAuth = a token is accepted.
      # In Flask this is @jwt_required(optional=True).
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignDetail' }
              examples:
                rice: { $ref: '#/components/examples/CampaignDetailRice' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # Locations
  # ------------------------------------------------------------------
  /locations:
    get:
      summary: List active locations
      description: >
        The delivery areas shown in the Join pop-up. Every campaign uses the
        same list, so it is its own endpoint instead of being repeated inside
        each campaign. Inactive locations are not returned.
      operationId: listLocations
      tags: [Locations]
      security: []
      responses:
        '200':
          description: Active locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Location' }
              examples:
                all: { $ref: '#/components/examples/LocationList' }

  # ------------------------------------------------------------------
  # Orders (consumer only: sellers and admins get 403)
  # ------------------------------------------------------------------
  /orders:
    post:
      summary: Place an order (pay with simulated M-Pesa)
      description: >
        Payment is taken first; the order is only created if it succeeds,
        so every order has exactly one payment.
      operationId: createOrder
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
            examples:
              delivery: { $ref: '#/components/examples/OrderCreateDelivery' }
              collection: { $ref: '#/components/examples/OrderCreateCollection' }
      responses:
        '201':
          description: Order placed and paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
              examples:
                delivery: { $ref: '#/components/examples/OrderPaidDelivery' }
        '400':
          description: A business rule was broken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                campaignClosed: { $ref: '#/components/examples/ErrorCampaignClosed' }
                maxPerUser: { $ref: '#/components/examples/ErrorMaxPerUser' }
                belowMinimum: { $ref: '#/components/examples/ErrorBelowMinimum' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Fields failed validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                addressRequired: { $ref: '#/components/examples/ErrorAddressRequired' }
    get:
      summary: List my orders
      description: The caller's orders, newest first. An empty list if they have none.
      operationId: listOrders
      tags: [Orders]
      responses:
        '200':
          description: The caller's orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderSummary' }
              examples:
                mine: { $ref: '#/components/examples/OrderList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      summary: Get one of my orders (order tracking page)
      operationId: getOrder
      tags: [Orders]
      responses:
        '200':
          description: The order, with its payment and status history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
              examples:
                paidDelivery: { $ref: '#/components/examples/OrderPaidDelivery' }
                readyForCollection: { $ref: '#/components/examples/OrderReadyForCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{order_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      summary: Cancel my order (full refund)
      description: Allowed until the campaign's cancellation_cutoff. The whole order is cancelled and refunded.
      operationId: cancelOrder
      tags: [Orders]
      responses:
        '200':
          description: The cancelled order, with its refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
              examples:
                cancelled: { $ref: '#/components/examples/OrderCancelled' }
        '400':
          description: The order can no longer be cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                pastCutoff: { $ref: '#/components/examples/ErrorPastCutoff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{order_id}/confirm-receipt:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      summary: Confirm I received my order
      description: Allowed once the order is dispatched or ready_for_collection. Moves it to completed.
      operationId: confirmReceipt
      tags: [Orders]
      responses:
        '200':
          description: The completed order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
              examples:
                completed: { $ref: '#/components/examples/OrderCompleted' }
        '400':
          description: The order is not ready to be confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notReady: { $ref: '#/components/examples/ErrorNotReady' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # The logged-in user
  # ------------------------------------------------------------------
  /me:
    get:
      summary: Who am I? (any logged-in user)
      description: Used by React on page load to restore the session from a stored token.
      operationId: getMe
      tags: [Account]
      responses:
        '200':
          description: The logged-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              examples:
                pendingSeller: { $ref: '#/components/examples/MeSellerPending' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------
  # Seller (wholesaler) - role seller only; others get 403
  # ------------------------------------------------------------------
  /seller/products:
    get:
      summary: My products, with approval status
      description: Every product this seller has submitted, newest first, in every approval status.
      operationId: listMyProducts
      tags: [Seller]
      responses:
        '200':
          description: The seller's products (empty list if none)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SellerProduct' }
              examples:
                davy: { $ref: '#/components/examples/SellerProductList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Submit a product for approval
      description: >
        Creates a product with approval_status "pending". Only an APPROVED seller
        can submit; a pending or rejected seller gets 403 SELLER_NOT_APPROVED.
      operationId: submitProduct
      tags: [Seller]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
            examples:
              beans: { $ref: '#/components/examples/ProductCreateBeans' }
      responses:
        '201':
          description: Product submitted (pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProduct' }
              examples:
                submitted: { $ref: '#/components/examples/SellerProductPending' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not a seller, or the seller is not approved yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notApproved: { $ref: '#/components/examples/ErrorSellerNotApproved' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /seller/campaigns:
    get:
      summary: Campaigns running on my products
      description: Every non-draft campaign for this seller's products, in any status, soonest deadline first.
      operationId: listMyCampaigns
      tags: [Seller]
      responses:
        '200':
          description: The seller's campaigns
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CampaignSummary' }
              examples:
                davy: { $ref: '#/components/examples/SellerCampaignList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /seller/campaigns/{campaign_id}/orders:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: How much to supply, split by delivery and collection
      description: >
        Totals only, grouped by fulfilment and then by location. Sellers never see
        shoppers' names, phone numbers, addresses or payment references.
        Counts only live orders (not cancelled or refunded).
      operationId: getMyCampaignOrders
      tags: [Seller]
      responses:
        '200':
          description: Units needed per fulfilment type and location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerCampaignOrders' }
              examples:
                tomatoes: { $ref: '#/components/examples/SellerCampaignOrdersTomatoes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # Admin - role admin only; others get 403
  # ------------------------------------------------------------------
  /admin/sellers:
    get:
      summary: Sellers, filtered by verification status
      operationId: adminListSellers
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
          description: Leave out to get every seller. The approvals screen uses status=pending.
      responses:
        '200':
          description: Sellers, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminSeller' }
              examples:
                pending: { $ref: '#/components/examples/AdminSellerListPending' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/sellers/{seller_id}/approve:
    parameters:
      - $ref: '#/components/parameters/SellerId'
    post:
      summary: Approve a seller
      description: Sets verification_status to approved, reviewed_by to the admin and reviewed_at to now.
      operationId: adminApproveSeller
      tags: [Admin]
      responses:
        '200':
          description: The approved seller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSeller' }
              examples:
                approved: { $ref: '#/components/examples/AdminSellerApproved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/sellers/{seller_id}/reject:
    parameters:
      - $ref: '#/components/parameters/SellerId'
    post:
      summary: Reject a seller, with a reason
      operationId: adminRejectSeller
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
            example: { reason: Business registration number could not be verified. }
      responses:
        '200':
          description: The rejected seller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSeller' }
              examples:
                rejected: { $ref: '#/components/examples/AdminSellerRejected' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/products:
    get:
      summary: Products, filtered by approval status
      operationId: adminListProducts
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
          description: Leave out to get every product. The approvals screen uses status=pending; the create-campaign form uses status=approved.
      responses:
        '200':
          description: Products, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminProduct' }
              examples:
                pending: { $ref: '#/components/examples/AdminProductListPending' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/products/{product_id}/approve:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      summary: Approve a product
      description: Only a product whose seller is approved can be approved (400 SELLER_NOT_APPROVED otherwise).
      operationId: adminApproveProduct
      tags: [Admin]
      responses:
        '200':
          description: The approved product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
              examples:
                approved: { $ref: '#/components/examples/AdminProductApproved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/products/{product_id}/reject:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      summary: Reject a product, with a reason
      description: The seller sees the reason on their products screen.
      operationId: adminRejectProduct
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
            example: { reason: Unit weight and photo missing. Please resubmit. }
      responses:
        '200':
          description: The rejected product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
              examples:
                rejected: { $ref: '#/components/examples/AdminProductRejected' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/campaigns:
    get:
      summary: All campaigns, in every status
      operationId: adminListCampaigns
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, successful, failed, fulfilling, completed, cancelled] }
          description: Leave out to get every campaign.
      responses:
        '200':
          description: Campaigns, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminCampaign' }
              examples:
                some: { $ref: '#/components/examples/AdminCampaignList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a draft campaign from an approved product
      description: >
        campaign_price is copied from the product's wholesale_price; the admin does not send it.
        cancellation_cutoff defaults to deadline minus 3 days when left out.
        Rules (400): product must be approved (PRODUCT_NOT_APPROVED); deadline in the future;
        cutoff on or before the deadline; min_quantity <= max_quantity <= product stock.
      operationId: adminCreateCampaign
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignCreate' }
            examples:
              sugar: { $ref: '#/components/examples/CampaignCreateSugar' }
      responses:
        '201':
          description: The new draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCampaign' }
              examples:
                draft: { $ref: '#/components/examples/AdminCampaignDraft' }
        '400':
          description: A campaign rule was broken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                productNotApproved: { $ref: '#/components/examples/ErrorProductNotApproved' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/campaigns/{campaign_id}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    patch:
      summary: Edit a draft campaign
      description: Send only the fields to change. Only drafts can be edited (400 CAMPAIGN_NOT_DRAFT).
      operationId: adminUpdateCampaign
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignUpdate' }
            example: { min_quantity: 40 }
      responses:
        '200':
          description: The updated draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCampaign' }
              examples:
                draft: { $ref: '#/components/examples/AdminCampaignDraft' }
        '400':
          description: Not a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notDraft: { $ref: '#/components/examples/ErrorCampaignNotDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/campaigns/{campaign_id}/activate:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      summary: Publish a draft (draft -> active)
      description: The deadline must still be in the future. The campaign appears in GET /campaigns straight away.
      operationId: adminActivateCampaign
      tags: [Admin]
      responses:
        '200':
          description: The active campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCampaign' }
              examples:
                active: { $ref: '#/components/examples/AdminCampaignActive' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/campaigns/{campaign_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      summary: Cancel a campaign that nobody has joined
      description: Allowed for a draft, or an active campaign with no live orders (400 CAMPAIGN_HAS_ORDERS otherwise; close it instead).
      operationId: adminCancelCampaign
      tags: [Admin]
      responses:
        '200':
          description: The cancelled campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCampaign' }
              examples:
                cancelled: { $ref: '#/components/examples/AdminCampaignCancelled' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/campaigns/{campaign_id}/close:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      summary: Close an active campaign now (success or fail)
      description: >
        Same logic as the `flask close-campaigns` command, for one campaign, even before its deadline.
        Minimum reached -> successful, paid orders become confirmed.
        Minimum missed -> failed, every live order is refunded automatically (campaign_failed).
        Only active campaigns can be closed (400 CAMPAIGN_NOT_ACTIVE).
      operationId: adminCloseCampaign
      tags: [Admin]
      responses:
        '200':
          description: What happened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignCloseResult' }
              examples:
                failed: { $ref: '#/components/examples/CampaignCloseFailed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/campaigns/{campaign_id}/orders:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: A campaign's orders, for fulfilment
      description: Every order in the campaign, including cancelled and refunded ones, oldest first. next_statuses lists the steps the admin may set now.
      operationId: adminListCampaignOrders
      tags: [Admin]
      responses:
        '200':
          description: The campaign's orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminOrder' }
              examples:
                tomatoes: { $ref: '#/components/examples/AdminOrderListTomatoes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/campaigns/{campaign_id}/orders/status:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      summary: Move all of a campaign's orders one step at once (batch fulfilment)
      description: >
        Applies the status to every live order for which it is an allowed next step, and skips the rest
        (a collection order is never set to dispatched). The first move to preparing turns a successful
        campaign into fulfilling.
      operationId: adminBatchOrderStatus
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
            example: { status: preparing, note: Stock received from the seller }
      responses:
        '200':
          description: How many orders moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchStatusResult' }
              example: { updated: 2, skipped: 2, campaign_status: fulfilling }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/orders/{order_id}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      summary: Move one order to its next step
      description: >
        Allowed steps: confirmed -> preparing; preparing -> dispatched (delivery only) or
        ready_for_collection (collection only). Completed is set by the shopper's confirm-receipt.
        Anything else is 400 INVALID_STATUS_STEP.
      operationId: adminUpdateOrderStatus
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
            example: { status: ready_for_collection, note: Ready at Woodvale Grove pickup desk }
      responses:
        '200':
          description: The updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
              examples:
                dispatched: { $ref: '#/components/examples/AdminOrderDispatched' }
        '400':
          description: Not an allowed next step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidStep: { $ref: '#/components/examples/ErrorInvalidStatusStep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/locations:
    get:
      summary: All locations, including inactive ones
      operationId: adminListLocations
      tags: [Admin]
      responses:
        '200':
          description: Every location
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminLocation' }
              examples:
                all: { $ref: '#/components/examples/AdminLocationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Add a location
      operationId: adminCreateLocation
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationCreate' }
            example: { name: Thika, delivery_fee: 250, collection_point: 'Thika Town, Kenyatta Highway pickup desk' }
      responses:
        '201':
          description: The new location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLocation' }
              examples:
                thika: { $ref: '#/components/examples/AdminLocationNew' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A location with this name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: A location with this name already exists., code: LOCATION_EXISTS }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/locations/{location_id}:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    patch:
      summary: Edit a location, or switch it on or off
      description: >
        Send only the fields to change. A new delivery_fee applies to new orders only;
        existing orders keep their logistics_charge. is_active false hides it from GET /locations.
      operationId: adminUpdateLocation
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdate' }
            example: { is_active: false }
      responses:
        '200':
          description: The updated location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLocation' }
              examples:
                inactive: { $ref: '#/components/examples/AdminLocationInactive' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A location with this name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # Path parameters used by several paths, written once.
  parameters:
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

    SellerId:
      name: seller_id
      in: path
      required: true
      description: The seller_profiles id (not the user id).
      schema: { type: integer, minimum: 1 }
    ProductId:
      name: product_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    LocationId:
      name: location_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    # ---------------- Accounts ----------------
    ConsumerRegister:
      type: object
      required: [full_name, phone, email, password]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 120 }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: string, format: email, maxLength: 120 }
        password: { type: string, minLength: 8, writeOnly: true }

    WholesalerRegister:
      allOf:
        - $ref: '#/components/schemas/ConsumerRegister'
        - type: object
          required: [business_name, registration_number, business_address]
          properties:
            business_name: { type: string, maxLength: 150 }
            registration_number: { type: string, maxLength: 60 }
            business_address: { type: string, maxLength: 255 }

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }   # no minLength on login: just check it

    Phone:
      type: string
      pattern: '^\+?[0-9]{9,15}$'
      example: '+254712345678'

    # One User shape for every role. `seller` holds the seller_profiles row:
    # filled in for wholesalers, null for consumers and admins.
    User:
      type: object
      required: [id, full_name, phone, email, role, seller]
      properties:
        id: { type: integer, readOnly: true }
        full_name: { type: string }
        phone: { type: [string, 'null'] }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, seller, consumer], readOnly: true }
        seller:
          oneOf:
            - $ref: '#/components/schemas/SellerProfile'
            - type: 'null'

    SellerProfile:
      type: object
      required: [business_name, business_address, verification_status, rejection_reason]
      properties:
        business_name: { type: string }
        business_address: { type: [string, 'null'] }
        verification_status: { type: string, enum: [pending, approved, rejected], readOnly: true }
        rejection_reason:
          type: [string, 'null']
          readOnly: true
          description: Filled in only when verification_status is rejected.

    AuthResponse:
      type: object
      required: [user, access_token, token_type]
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
        token_type: { type: string, const: Bearer }

    # ---------------- Catalogue ----------------
    # A fixed list. The database column is free text; the API keeps it to these values.
    # The frontend maps each value to a label and icon (rice_grains -> "Rice & grains").
    Category:
      type: string
      enum: [vegetables, fruits, rice_grains, flour, cooking_oil, sugar, pulses, dairy_eggs]

    # The product as a shopper sees it on a card.
    # wholesale_price is deliberately NOT here: shoppers see the campaign's price.
    ProductSummary:
      type: object
      required: [id, name, unit, category, image_url, retail_price]
      properties:
        id: { type: integer }
        name: { type: string }
        unit: { type: string, example: 1kg }
        category: { $ref: '#/components/schemas/Category' }
        image_url:
          type: [string, 'null']
          format: uri-reference
          description: Null when no photo was uploaded; the frontend shows a placeholder.
        retail_price: { type: integer, description: 'Shop price, used for the struck-through price and savings.' }

    # Extra product details for the campaign page.
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [description, source, seller_name]
          properties:
            description: { type: [string, 'null'] }
            source: { type: string, enum: [seller, platform] }
            seller_name: { type: string, description: '"Bread & Basket" for platform-sourced products.' }

    Location:
      type: object
      required: [id, name, delivery_fee, collection_point]
      properties:
        id: { type: integer }
        name: { type: string }
        delivery_fee:
          type: integer
          description: >
            The CURRENT flat delivery fee for this area. Collection is free.
            What an order actually paid is its logistics_charge snapshot.
        collection_point: { type: string }

    # ---------------- Campaigns ----------------
    # A campaign card (home rails and browse grid).
    # readOnly fields need the orders table, so only the server can work them out.
    CampaignSummary:
      type: object
      required: [id, title, status, campaign_price, min_quantity, max_quantity, deadline,
                 ordered_quantity, households, min_reached, sold_out, savings_per_unit, product]
      properties:
        # stored
        id: { type: integer }
        title: { type: string }
        status:
          type: string
          enum: [draft, active, successful, failed, fulfilling, completed, cancelled]
        campaign_price: { type: integer, description: The price shoppers pay per unit (before the platform fee). }
        min_quantity: { type: integer, description: Units needed by the deadline for the campaign to succeed. }
        max_quantity: { type: integer, description: Total units available. }
        deadline: { type: string, format: date-time }
        # calculated by the server
        ordered_quantity: { type: integer, readOnly: true, description: Units in orders that are not cancelled or refunded. }
        households: { type: integer, readOnly: true, description: Distinct shoppers with a live order. }
        min_reached: { type: boolean, readOnly: true, description: ordered_quantity >= min_quantity }
        sold_out: { type: boolean, readOnly: true, description: ordered_quantity >= max_quantity }
        savings_per_unit: { type: integer, readOnly: true, description: product.retail_price - campaign_price }
        # nested
        product: { $ref: '#/components/schemas/ProductSummary' }
      # Left to the frontend on purpose (presentation only): progress bar width,
      # the minimum marker position, "3 days left" and "Ending soon".

    # The campaign page and Join pop-up: the card fields plus what checkout needs.
    CampaignDetail:
      allOf:
        - $ref: '#/components/schemas/CampaignSummary'
        - type: object
          required: [platform_charge, min_order_quantity, max_per_user, cancellation_cutoff,
                     remaining_quantity, can_join, my_quantity, max_orderable, product]
          properties:
            # stored
            platform_charge: { type: integer, description: Platform fee per unit. }
            min_order_quantity: { type: integer, description: Smallest quantity per order. }
            max_per_user:
              type: [integer, 'null']
              description: Most units one shopper may hold across all their orders. Null means no limit.
            cancellation_cutoff: { type: string, format: date-time, description: Last moment to cancel for a full refund. }
            # calculated by the server
            remaining_quantity: { type: integer, readOnly: true, description: max_quantity - ordered_quantity }
            can_join:
              type: boolean
              readOnly: true
              description: True while the campaign is active, before its deadline and not sold out.
            # personal: depends on who is asking, so null without a token
            my_quantity:
              type: [integer, 'null']
              readOnly: true
              description: Units this shopper already holds in live orders for this campaign.
            max_orderable:
              type: [integer, 'null']
              readOnly: true
              description: >
                Most units this shopper can still add: the smaller of
                remaining_quantity and (max_per_user - my_quantity).
                If it is below min_order_quantity, the shopper has hit their limit.
            # the campaign page shows the fuller product
            product: { $ref: '#/components/schemas/ProductDetail' }

    # ---------------- Orders ----------------
    OrderStatus:
      type: string
      enum: [paid, confirmed, preparing, dispatched, ready_for_collection, completed, cancelled, refunded]

    Fulfilment:
      type: string
      enum: [delivery, collection]

    OrderCreate:
      type: object
      required: [campaign_id, quantity, fulfilment, phone, location_id]
      properties:
        campaign_id: { type: integer }
        quantity: { type: integer, minimum: 1 }
        fulfilment: { $ref: '#/components/schemas/Fulfilment' }
        phone:
          allOf: [{ $ref: '#/components/schemas/Phone' }]
          writeOnly: true
          description: The M-Pesa number to charge (simulated). Not stored on the order.
        location_id: { type: integer, description: Delivery area, or the area whose collection point is used. }
        delivery_address:
          type: string
          maxLength: 255
          description: Required when fulfilment is delivery; ignored for collection.

    # A card on the My Orders page.
    OrderSummary:
      type: object
      required: [id, order_no, status, quantity, total_amount, fulfilment, delivery_address,
                 created_at, cancellation_cutoff, can_cancel, location, campaign, refund]
      properties:
        # stored
        id: { type: integer }
        order_no: { type: string, example: ODR-10003 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        quantity: { type: integer }
        total_amount:
          type: integer
          readOnly: true
          description: quantity x (unit_price + platform_charge) + logistics_charge
        fulfilment: { $ref: '#/components/schemas/Fulfilment' }
        delivery_address: { type: [string, 'null'], description: Null for collection orders. }
        created_at: { type: string, format: date-time }
        # copied from the campaign so the card can show "Free cancellation until ..."
        cancellation_cutoff: { type: string, format: date-time, readOnly: true }
        # calculated
        can_cancel:
          type: boolean
          readOnly: true
          description: True while status is paid or confirmed and the cutoff has not passed.
        # nested
        location: { $ref: '#/components/schemas/Location' }
        campaign: { $ref: '#/components/schemas/CampaignSummary' }
        refund:
          description: Null unless the order was cancelled or refunded.
          oneOf:
            - $ref: '#/components/schemas/Refund'
            - type: 'null'

    # The order tracking page: the card plus the price breakdown, payment and timeline.
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [unit_price, platform_charge, logistics_charge, payment, history]
          properties:
            # snapshots taken when the order was placed
            unit_price: { type: integer, readOnly: true }
            platform_charge: { type: integer, readOnly: true, description: Per unit. }
            logistics_charge: { type: integer, readOnly: true, description: Flat per order; 0 for collection. }
            payment: { $ref: '#/components/schemas/Payment' }   # never null: no payment, no order
            history:
              type: array
              description: Every status the order has been through, oldest first.
              items: { $ref: '#/components/schemas/OrderStatusHistory' }

    Payment:
      type: object
      required: [reference, status, amount, paid_at]
      properties:
        reference: { type: string, example: QGH7X2K9LM }
        status: { type: string, enum: [successful, refunded] }
        amount: { type: integer }
        paid_at: { type: string, format: date-time }

    Refund:
      type: object
      required: [amount, reason, automatic, processed_at]
      properties:
        amount: { type: integer }
        reason: { type: string, enum: [consumer_cancelled, campaign_failed] }
        automatic: { type: boolean, readOnly: true, description: True when processed_by is null (campaign failed). }
        processed_at: { type: string, format: date-time }

    OrderStatusHistory:
      type: object
      required: [status, note, created_at]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    # ---------------- Errors ----------------
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: This campaign is no longer taking orders. }
        code: { type: string, example: CAMPAIGN_CLOSED }

    # ---------------- Seller ----------------
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected]

    # A product as its seller sees it: the card fields plus prices, stock and approval.
    SellerProduct:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [description, wholesale_price, stock_quantity, approval_status, rejection_reason, created_at]
          properties:
            description: { type: [string, 'null'] }
            wholesale_price: { type: integer, description: The seller's price per unit; becomes the campaign price. }
            stock_quantity: { type: integer }
            approval_status: { $ref: '#/components/schemas/ApprovalStatus' }
            rejection_reason:
              type: [string, 'null']
              description: Filled in only when approval_status is rejected.
            created_at: { type: string, format: date-time, readOnly: true }

    ProductCreate:
      type: object
      required: [name, category, unit, wholesale_price, retail_price, stock_quantity]
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        category: { $ref: '#/components/schemas/Category' }
        unit: { type: string, maxLength: 40, example: 1kg }
        image_url:
          type: string
          format: uri-reference
          maxLength: 255
          description: MVP stores a URL; no file upload.
        wholesale_price: { type: integer, minimum: 1 }
        retail_price: { type: integer, minimum: 1, description: Must be higher than wholesale_price (400 otherwise). }
        stock_quantity: { type: integer, minimum: 0 }

    LocationUnits:
      type: object
      required: [location_id, location_name, units, order_count]
      properties:
        location_id: { type: integer }
        location_name: { type: string }
        units: { type: integer }
        order_count: { type: integer }

    FulfilmentGroup:
      type: object
      required: [total_units, order_count, locations]
      properties:
        total_units: { type: integer }
        order_count: { type: integer }
        locations:
          type: array
          description: One row per location with live orders, most units first.
          items: { $ref: '#/components/schemas/LocationUnits' }

    SellerCampaignOrders:
      type: object
      required: [campaign, delivery, collection]
      properties:
        campaign: { $ref: '#/components/schemas/CampaignSummary' }
        delivery: { $ref: '#/components/schemas/FulfilmentGroup' }
        collection: { $ref: '#/components/schemas/FulfilmentGroup' }

    # ---------------- Admin ----------------
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 255 }

    AdminSeller:
      type: object
      required: [id, user, business_name, registration_number, business_address, verification_status,
                 rejection_reason, reviewed_at, created_at]
      properties:
        id: { type: integer, description: The seller_profiles id. }
        user:
          type: object
          required: [id, full_name, email, phone]
          properties:
            id: { type: integer }
            full_name: { type: string }
            email: { type: string, format: email }
            phone: { type: [string, 'null'] }
        business_name: { type: string }
        registration_number: { type: string }
        business_address: { type: string }
        verification_status: { $ref: '#/components/schemas/ApprovalStatus' }
        rejection_reason: { type: [string, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/SellerProduct'
        - type: object
          required: [source, seller, reviewed_at]
          properties:
            source: { type: string, enum: [seller, platform] }
            seller:
              description: Null for platform-sourced products.
              oneOf:
                - type: object
                  required: [id, business_name, verification_status]
                  properties:
                    id: { type: integer }
                    business_name: { type: string }
                    verification_status: { $ref: '#/components/schemas/ApprovalStatus' }
                - type: 'null'
            reviewed_at: { type: [string, 'null'], format: date-time }

    # The admin's view of a campaign: every status, plus the settings and dates.
    AdminCampaign:
      allOf:
        - $ref: '#/components/schemas/CampaignSummary'
        - type: object
          required: [platform_charge, min_order_quantity, max_per_user, cancellation_cutoff, closed_at, created_at]
          properties:
            platform_charge: { type: integer }
            min_order_quantity: { type: integer }
            max_per_user: { type: [integer, 'null'] }
            cancellation_cutoff: { type: string, format: date-time }
            closed_at: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }

    CampaignCreate:
      type: object
      required: [product_id, title, min_quantity, max_quantity, deadline]
      properties:
        product_id: { type: integer, description: Must be an approved product. }
        title: { type: string, minLength: 3, maxLength: 150 }
        min_quantity: { type: integer, minimum: 1 }
        max_quantity: { type: integer, minimum: 1, description: At most the product's stock_quantity. }
        min_order_quantity: { type: integer, minimum: 1, default: 1 }
        max_per_user: { type: [integer, 'null'], minimum: 1, description: Leave out or null for no limit. }
        platform_charge: { type: integer, minimum: 0, default: 10 }
        deadline: { type: string, format: date-time }
        cancellation_cutoff:
          type: string
          format: date-time
          description: Defaults to deadline minus 3 days. Must be on or before the deadline.

    CampaignUpdate:
      type: object
      description: Any CampaignCreate field except product_id; send only what changes.
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 150 }
        min_quantity: { type: integer, minimum: 1 }
        max_quantity: { type: integer, minimum: 1 }
        min_order_quantity: { type: integer, minimum: 1 }
        max_per_user: { type: [integer, 'null'], minimum: 1 }
        platform_charge: { type: integer, minimum: 0 }
        deadline: { type: string, format: date-time }
        cancellation_cutoff: { type: string, format: date-time }

    CampaignCloseResult:
      type: object
      required: [campaign, outcome, orders_confirmed, orders_refunded]
      properties:
        campaign: { $ref: '#/components/schemas/AdminCampaign' }
        outcome: { type: string, enum: [successful, failed] }
        orders_confirmed: { type: integer, description: Paid orders moved to confirmed (successful only). }
        orders_refunded: { type: integer, description: Live orders refunded automatically (failed only). }

    # An order as the admin sees it while fulfilling: includes who and where.
    AdminOrder:
      type: object
      required: [id, order_no, status, quantity, total_amount, fulfilment, location, delivery_address,
                 consumer, created_at, next_statuses]
      properties:
        id: { type: integer }
        order_no: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        quantity: { type: integer }
        total_amount: { type: integer }
        fulfilment: { $ref: '#/components/schemas/Fulfilment' }
        location:
          type: object
          required: [id, name, collection_point]
          properties:
            id: { type: integer }
            name: { type: string }
            collection_point: { type: string }
        delivery_address: { type: [string, 'null'] }
        consumer:
          type: object
          required: [id, full_name, phone]
          properties:
            id: { type: integer }
            full_name: { type: string }
            phone: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        next_statuses:
          type: array
          readOnly: true
          description: The steps the admin may set now. Empty when nothing is allowed.
          items: { $ref: '#/components/schemas/AdminSettableStatus' }

    AdminSettableStatus:
      type: string
      enum: [preparing, dispatched, ready_for_collection]

    StatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AdminSettableStatus' }
        note: { type: [string, 'null'], maxLength: 255, description: Shown on the shopper's timeline. }

    BatchStatusResult:
      type: object
      required: [updated, skipped, campaign_status]
      properties:
        updated: { type: integer }
        skipped: { type: integer, description: Live orders for which this was not an allowed step. }
        campaign_status:
          type: string
          enum: [draft, active, successful, failed, fulfilling, completed, cancelled]

    AdminLocation:
      allOf:
        - $ref: '#/components/schemas/Location'
        - type: object
          required: [is_active]
          properties:
            is_active: { type: boolean }

    LocationCreate:
      type: object
      required: [name, delivery_fee, collection_point]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        delivery_fee: { type: integer, minimum: 0 }
        collection_point: { type: string, minLength: 3, maxLength: 150 }
        is_active: { type: boolean, default: true }

    LocationUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        delivery_fee: { type: integer, minimum: 0 }
        collection_point: { type: string, minLength: 3, maxLength: 150 }
        is_active: { type: boolean }

  responses:
    Unauthorized:
      description: Missing, invalid or expired token, or wrong email/password
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Please log in again., code: UNAUTHORIZED }
    Forbidden:
      description: Logged in, but this role may not use this endpoint
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Only consumer accounts can do this., code: FORBIDDEN }
    NotFound:
      description: The item does not exist (or is not yours)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Not found., code: NOT_FOUND }
    Conflict:
      description: Email already registered
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: An account with this email already exists., code: EMAIL_TAKEN }
    ValidationFailed:
      description: Fields failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'quantity: Must be greater than or equal to 1.', code: VALIDATION_FAILED }

  # ------------------------------------------------------------------
  # Examples (used by Prism; pick one with the header `Prefer: example=<name>`)
